{% extends "base.html" %}

{% block title %}Internal Server Error (500) - NitiSim{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 text-center">
            <div class="error-card">
                <div class="brand-emblem mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem; background: var(--color-danger-bg); border-color: var(--color-danger-border); color: var(--color-danger);">
                    <i class="fas fa-triangle-exclamation"></i>
                </div>
                <div class="error-code text-danger">500</div>
                <h2 class="h4 fw-bold text-dark mb-2">Simulation Engine Error</h2>
                <p class="text-secondary small mb-4">
                    An internal calculation or database error interrupted the process. The transaction was safely rolled back.
                </p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('index') }}" class="btn btn-emerald">
                        <i class="fas fa-home me-1"></i>Return Home
                    </a>
                    <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary">
                        <i class="fas fa-chart-pie me-1"></i>Policy Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
